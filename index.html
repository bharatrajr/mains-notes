<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<meta name="mobile-web-app-capable" content="yes">
<title>Mains Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#faf9f7;--surface:#fff;--ink:#1c1c1c;--muted:#6d6a66;--line:#e8e4de;--accent:#2f4b7c;--accent-ink:#fff;--soft:#eef1f6;--again:#b33d3d;--hard:#a4651c;--good:#2e7a4e;--easy:#2f5d9c;--mark:#fff0b0;--fs:17px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131313;--surface:#1c1c1c;--ink:#e8e6e2;--muted:#9a968f;--line:#2c2b29;--accent:#93b2e6;--accent-ink:#111;--soft:#212833;--again:#e07a7a;--hard:#d9a35a;--good:#6cc492;--easy:#8fb2ea;--mark:#5b4a12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131313;--surface:#1c1c1c;--ink:#e8e6e2;--muted:#9a968f;--line:#2c2b29;--accent:#93b2e6;--accent-ink:#111;--soft:#212833;--again:#e07a7a;--hard:#d9a35a;--good:#6cc492;--easy:#8fb2ea;--mark:#5b4a12;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Telugu",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
header#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header#top h1{font-size:17px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;padding:6px;border-radius:8px;color:var(--muted);cursor:pointer;display:inline-flex}
.iconbtn:active{background:var(--soft)}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
nav#nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav#nav a{flex:1;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:4px 0;position:relative}
nav#nav a.on{color:var(--accent)}
nav#nav svg{width:22px;height:22px}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:10px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
body.focus header#top,body.focus nav#nav{display:none}
body.focus main{padding-top:24px}
#exitfocus{display:none;position:fixed;right:14px;bottom:18px;z-index:7}
body.focus #exitfocus{display:inline-flex}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--again)}
.btn.block{display:flex;width:100%;padding:13px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
textarea.tall{min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted);margin-right:4px}
.list .item{display:block;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);cursor:pointer}
.list .item:last-child{border-bottom:0}
.item .t{font-weight:500}
.item .s{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stats3 b{display:block;font-size:26px;font-weight:600}
.stats3 span{font-size:12px;color:var(--muted)}
.stats3 .n b{color:var(--easy)}.stats3 .l b{color:var(--again)}.stats3 .r b{color:var(--good)}
.reading{font-size:var(--fs);line-height:1.7}
.reading h2,.reading h3,.reading h4,.reading h5{margin:20px 0 6px;line-height:1.3}
.reading h2{font-size:1.2em}.reading h3{font-size:1.08em}.reading h4,.reading h5{font-size:1em}
.reading p{margin:8px 0}
.reading ul,.reading ol{margin:6px 0;padding-left:22px}
.reading li{margin:3px 0}
.reading table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.9em;display:block;overflow-x:auto}
.reading th,.reading td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.reading th{background:var(--soft)}
.reading blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.9em}
.sec{margin-top:18px}
.sec>.h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.facts li{margin:4px 0}
.actions{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.actions .btn{padding:6px 10px;font-size:14px}
.blur{filter:blur(7px);user-select:none;cursor:pointer;transition:filter .2s}
/* review */
.rv-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rv-top select{flex:1;padding:8px 10px}
.cnt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.cnt .n{color:var(--easy)}.cnt .l{color:var(--again)}.cnt .r{color:var(--good)}
.cnt u{text-decoration-thickness:2px;text-underline-offset:3px}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:220px;font-size:var(--fs);line-height:1.65}
.flash .divider{border:0;border-top:1px dashed var(--line);margin:16px 0}
.flash .src{margin-top:16px;font-size:12px;color:var(--muted)}
.cz{background:var(--soft);color:var(--accent);font-weight:600;padding:0 6px;border-radius:5px}
.cz.on{background:var(--mark);color:inherit}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades small{font-size:11px;color:var(--muted)}
.grades .g1 b{color:var(--again)}.grades .g2 b{color:var(--hard)}.grades .g3 b{color:var(--good)}.grades .g4 b{color:var(--easy)}
.rv-tools{display:flex;justify-content:center;gap:2px;margin-top:14px;flex-wrap:wrap}
.rv-tools button{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 10px;cursor:pointer;border-radius:8px}
.rv-tools button:active{background:var(--soft)}
.progress{height:3px;background:var(--line);border-radius:2px;margin-bottom:12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* practice */
.timer{font-size:44px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.timer.over{color:var(--again)}
.wc{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scores button{padding:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.scores button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* stats */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--line);display:block}
.heat i.h1{background:color-mix(in srgb,var(--good) 30%,var(--line))}.heat i.h2{background:color-mix(in srgb,var(--good) 55%,var(--line))}.heat i.h3{background:color-mix(in srgb,var(--good) 80%,var(--line))}.heat i.h4{background:var(--good)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted)}
.bars div i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
/* modal & toast */
#modal{display:none}
#modal.on{display:block}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.mbg{align-items:center}.mbox{border-radius:16px}}
.mbox h3{margin-top:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
.steps .stepn{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;align-items:center;justify-content:center;margin-right:8px;font-weight:600}
.pv{border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;display:flex;gap:10px;align-items:flex-start}
.pv input{margin-top:4px;width:18px;height:18px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.switch input{width:20px;height:20px}
pre.prompt{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:10px;border-radius:8px;max-height:220px;overflow:auto}
.hide{display:none!important}
/* feed & game */
:root{--gold:#b07d10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#e5c15a}}
:root[data-theme="dark"]{--gold:#e5c15a}
.bulk{margin:0 0 12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.bulk .list{max-height:320px;overflow-y:auto}
.prt.on{background:var(--soft);border-radius:8px;padding-left:8px;padding-right:8px}
.prt .btn{padding:6px 12px}
.hero{display:flex;gap:14px;align-items:center}
.hero .ring{flex:none}
.risk{color:var(--again);font-size:13px;margin:-4px 0 10px}
body.feedon{overflow:hidden}
body.feedon #exitfocus{display:none!important}
.feed{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.hud{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(var(--bg) 70%,transparent)}
.gbar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .4s}
.hud .cnt{font-size:13px}
.combo{font-size:13px;font-weight:700;color:var(--hard);min-width:34px}
.fs{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.fs-in{width:100%;max-width:640px;max-height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
.fs.bonus .fs-in{border:2px solid var(--gold)}
.ftag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.fs.bonus .ftag{color:var(--gold)}
.ftitle{font-size:13px;color:var(--muted);margin-bottom:8px}
.fs .flash{border:0;padding:0;min-height:0}
.qctl{margin-top:14px}
.qctl .grades{grid-template-columns:1fr 1fr}
.ok{text-align:center;color:var(--good);font-weight:600;padding:10px}
.swipe{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
.xpf{position:fixed;right:18px;top:calc(44px + env(safe-area-inset-top));z-index:12;font-weight:700;color:var(--good);pointer-events:none;animation:xup 1s forwards}
.xpf.gold{color:var(--gold)}
@keyframes xup{to{transform:translateY(-28px);opacity:0}}
.cele{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;overflow:hidden}
.cele>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 28px;font-size:18px;animation:pop .35s ease-out}
.cele i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.cele i{display:none}.cele>div,.xpf{animation:none}.gbar i{transition:none}}
.syu{border-bottom:1px solid var(--line)}.syu:last-child{border-bottom:0}
.syh{display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer}
.syh .t{flex:1;font-weight:500}
.syh .btn{padding:4px 8px;font-size:13px}
.sypts{display:none;padding-bottom:6px}.syu.on .sypts{display:block}
.sypt{display:flex;align-items:flex-start;gap:2px;padding:6px 0 6px 10px;border-left:2px solid var(--line);margin:2px 0;font-size:15px}
.sypt span{flex:1;padding-top:3px}
.sypt .iconbtn{flex:none}
.idea .itext{font-size:15px;line-height:1.6}.idea .itext p{margin:4px 0}
.idea .btn{padding:6px 10px;font-size:14px}
.vc{text-align:center;font-size:13px;color:var(--muted);min-height:20px;margin-top:8px}
</style>
</head>
<body>
<header id="top">
  <button class="iconbtn hide" id="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">Today</h1>
  <button class="iconbtn hide" id="installbtn" aria-label="Install app"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  <button class="iconbtn" id="searchbtn" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
</header>
<main id="view"></main>
<nav id="nav">
  <a href="#/home" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</a>
  <a href="#/lib" data-r="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.5-1 3 15-3.5 1z"/></svg>Library</a>
  <a href="#/add" data-r="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>Add</a>
  <a href="#/review" data-r="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>Review<span class="badge hide" id="dueBadge"></span></a>
  <a href="#/syl" data-r="syl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Syllabus</a>
  <a href="#/ideas" data-r="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Ideas</a>
  <a href="#/more" data-r="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>More</a>
</nav>
<button class="btn" id="exitfocus">Exit focus</button>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= Basics ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const MIN=6e4,HOUR=36e5,DAY=864e5;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const arr=v=>Array.isArray(v)?v.filter(x=>x!=null&&String(x).trim()!=='').map(x=>typeof x==='string'?x.trim():(typeof x==='object'?Object.values(x).join(' — '):String(x))):(v?String(v).split(/\n+/).map(s=>s.replace(/^\s*[-*•]\s*/,'').trim()).filter(Boolean):[]);
const str=v=>v==null?'':(Array.isArray(v)?v.map(x=>'- '+x).join('\n'):String(v)).trim();

const PAPERS=[
  {id:'GE',name:'General English (Qualifying)'},
  {id:'P1',name:'Paper I · General Essay'},
  {id:'P2',name:'Paper II · History, Culture & Geography'},
  {id:'P3',name:'Paper III · Indian Society, Constitution & Governance'},
  {id:'P4',name:'Paper IV · Economy & Development'},
  {id:'P5',name:'Paper V · Science & Technology, Data Interpretation'},
  {id:'P6',name:'Paper VI · Telangana Movement & State Formation'}
];
const paperName=id=>(PAPERS.find(p=>p.id===id)||{name:'Unsorted'}).name;
const paperOpts=(sel,blank='Unsorted')=>`<option value="">${blank}</option>`+PAPERS.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
function normPaper(p){
  if(!p)return'';p=String(p).toUpperCase().trim();
  let m=p.match(/\b(GE|P[1-6])\b/);if(m)return m[1];
  m=p.match(/PAPER\s*[-–:]?\s*(VI|IV|V|III|II|I|[1-6])\b/);
  if(m){const map={I:1,II:2,III:3,IV:4,V:5,VI:6};return 'P'+(map[m[1]]||+m[1]);}
  if(/ENGLISH/.test(p))return'GE';if(/ESSAY/.test(p))return'P1';
  if(/MOVEMENT|STATE FORMATION/.test(p))return'P6';if(/HISTORY|GEOGRAPHY|CULTURE/.test(p))return'P2';
  if(/POLITY|CONSTITUTION|GOVERNANCE|SOCIETY/.test(p))return'P3';if(/ECONOM/.test(p))return'P4';
  if(/SCIENCE|TECHNOLOGY|DATA/.test(p))return'P5';return'';
}

const DB={db:null,

    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const o=t.objectStore(store);let out;const q=fn(o);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(s){return this.req(s,'readonly',o=>o.getAll())},
  put(s,v){return this.req(s,'readwrite',o=>{o.put(v)})},
  putMany(s,a){return this.req(s,'readwrite',o=>{a.forEach(v=>o.put(v))})},
  del(s,id){return this.req(s,'readwrite',o=>{o.delete(id)})},
  delMany(s,ids){return this.req(s,'readwrite',o=>{ids.forEach(id=>o.delete(id))})},
  clear(s){return this.req(s,'readwrite',o=>{o.clear()})},

/* ================= FSRS-4.5 scheduler ================= */
const FS={W:[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755],
  DECAY:-0.5,FACTOR:19/81,
  R(t,s){return s>0?Math.pow(1+this.FACTOR*t/s,this.DECAY):0},
  ivl(s){return s/this.FACTOR*(Math.pow(S.settings.retention,1/this.DECAY)-1)},
  D0(g){return clamp(this.W[4]-(g-3)*this.W[5],1,10)},
  nextD(d,g){return clamp(this.W[7]*this.W[4]+(1-this.W[7])*(d-this.W[6]*(g-3)),1,10)},
  sRecall(d,s,r,g){const W=this.W;return s*(1+Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1))},
  sForget(d,s,r){const W=this.W;return Math.min(s,W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp((1-r)*W[14]))}
};
function maxIvlDays(){let m=S.settings.maxIvl||365;const e=examDays();if(e!=null&&e>0)m=Math.min(m,e);return Math.max(1,m)}
function roundIvl(i){i=Math.max(1,Math.round(i));if(S.settings.fuzz&&i>2){const f=Math.max(1,Math.round(i*.05));i+=Math.round((Math.random()*2-1)*f)}return clamp(i,1,maxIvlDays())}
const dueFromDays=(d,now)=>dayStart(now)+d*DAY;
const curR=(c,now=Date.now())=>c.state===2||c.state===3?FS.R(Math.max(0,(now-c.last)/DAY),c.stability):null;
function preview(c,now=Date.now()){
  const st=S.settings,L=st.learnSteps.map(m=>m*MIN),RL=st.relearnSteps.map(m=>m*MIN),out={};
  const base={...c,reps:(c.reps||0)+1,last:now};
  const grad=(o,s)=>{const d=roundIvl(FS.ivl(s));o.state=2;o.step=0;o.ivl=d;o.due=dueFromDays(d,now);return o};
  const stay=(o,state,step,delay)=>{o.state=state;o.step=step;o.ivl=0;o.due=now+delay;return o};
  if(!c.state){
    for(const g of[1,2,3,4]){const o={...base,stability:FS.W[g-1],difficulty:FS.D0(g)};
      if(g===4||!L.length||(g===3&&L.length<2))grad(o,o.stability);
      else if(g===1)stay(o,1,0,L[0]);
      else if(g===2)stay(o,1,0,L.length>1?(L[0]+L[1])/2:L[0]*1.5);
      else stay(o,1,1,L[1]);
      out[g]=o}
  }else if(c.state===1||c.state===3){
    const steps=c.state===1?L:RL,step=c.step||0,s=c.stability;
    for(const g of[1,2,3,4]){const o={...base,difficulty:FS.nextD(c.difficulty,g),stability:s};
      if(g===4||!steps.length)grad(o,s);
      else if(g===1)stay(o,c.state,0,steps[0]);
      else if(g===2){const cur=steps[Math.min(step,steps.length-1)],nx=steps[step+1];stay(o,c.state,step,step===0&&nx?(cur+nx)/2:cur)}
      else{const ns=step+1;if(ns>=steps.length)grad(o,s);else stay(o,c.state,ns,steps[ns])}
      out[g]=o}
  }else{
    const r=FS.R(Math.max(0,(now-c.last)/DAY),c.stability);
    const o1={...base,difficulty:FS.nextD(c.difficulty,1),stability:FS.sForget(c.difficulty,c.stability,r),lapses:(c.lapses||0)+1};
    if(RL.length)stay(o1,3,0,RL[0]);else grad(o1,o1.stability);out[1]=o1;
    const ss={};for(const g of[2,3,4])ss[g]=FS.sRecall(c.difficulty,c.stability,r,g);
    const mx=maxIvlDays();let ih=roundIvl(FS.ivl(ss[2])),ig=roundIvl(FS.ivl(ss[3])),ie=roundIvl(FS.ivl(ss[4]));
    ih=Math.min(ih,ig);if(ig<=ih)ig=Math.min(ih+1,mx);if(ie<=ig)ie=Math.min(ig+1,mx);
    const iv={2:ih,3:ig,4:ie};
    for(const g of[2,3,4])out[g]={...base,difficulty:FS.nextD(c.difficulty,g),stability:ss[g],state:2,step:0,ivl:iv[g],due:dueFromDays(iv[g],now)};
  }
  if(out[3].state===2&&out[4].state===2&&out[4].ivl<=out[3].ivl){out[4].ivl=Math.min(out[3].ivl+1,maxIvlDays());out[4].due=dueFromDays(out[4].ivl,now)}
  return out;
}

function deckCards(deck){
  if(!deck||deck==='all')return S.cards;
  if(deck==='flag')return S.cards.filter(c=>c.flagged);
  if(deck==='aw')return S.cards.filter(c=>c.sourceType==='deck');
  if(deck==='star')return S.cards.filter(c=>{const s=srcOf(c);return s&&s.starred});
  if(deck.startsWith('src:')){const id=deck.slice(4);return S.cards.filter(c=>c.sourceId===id)}
  return S.cards.filter(c=>c.paper===deck);
}
function counts(deck='all',now=Date.now()){
  const end=dayEnd(now),today=dayKey(now);let learn=0,rev=0,nw=0;
  for(const c of deckCards(deck)){if(c.suspended)continue;if(!c.state)nw++;else if(c.state===2){if(c.due<end)rev++}else if(c.due<end)learn++}
  let newDone=0,revDone=0;for(const l of S.logs){if(l.day!==today)continue;if(l.prevState===0)newDone++;else if(l.prevState===2)revDone++}
  const extra=S.settings.extraNewDay===today?S.settings.extraNew:0;
  return{learn,review:Math.min(rev,Math.max(0,S.settings.reviewsPerDay-revDone)),newLeft:Math.min(nw,Math.max(0,S.settings.newPerDay+extra-newDone)),newTotal:nw,reviewTotal:rev,newDone,revDone};
}

/* ================= Markdown-lite ================= */
function inline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/==([^=]+)==/g,'<mark>$1</mark>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,'$1<em>$2</em>').replace(/(^|[^\w&])_([^_\n]+)_(?!\w)/g,'$1<em>$2</em>')}
function mdTable(rows){const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inline(c.trim()));
  const body=rows.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r));if(!body.length)return'';
  return'<table><thead><tr>'+cells(body[0]).map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+body.slice(1).map(r=>'<tr>'+cells(r).map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
function md(src){
  if(!src)return'';const lines=esc(String(src)).replace(/\r/g,'').split('\n'),out=[],st=[];
  const closeAll=()=>{while(st.length)out.push(`</li></${st.pop().t}>`)};
  const item=(ind,t)=>{
    if(!st.length||ind>st[st.length-1].ind){out.push(`<${t}><li>`);st.push({t,ind});return}
    while(st.length>1&&st[st.length-1].ind>ind)out.push(`</li></${st.pop().t}>`);
    const top=st[st.length-1];if(top.t!==t){out.push(`</li></${st.pop().t}><${t}><li>`);st.push({t,ind})}else out.push('</li><li>')};
  const isBlock=l=>/^(\s*([-*•]|\d+[.)])\s+|#{1,4}\s|&gt;|\s*\||\s*(---|\*\*\*)\s*$)/.test(l);
  for(let i=0;i<lines.length;i++){const L=lines[i];
    const m=L.match(/^(\s*)([-*•]|\d+[.)])\s+(.*)$/);
    if(m){item(m[1].replace(/\t/g,'    ').length,/\d/.test(m[2])?'ol':'ul');out.push(inline(m[3]));continue}
    if(!L.trim()){if(st.length&&i+1<lines.length&&/^\s*([-*•]|\d+[.)])\s+/.test(lines[i+1]))continue;closeAll();continue}
    if(st.length&&/^\s{2,}\S/.test(L)){out.push('<br>'+inline(L.trim()));continue}
    closeAll();
    let h=L.match(/^(#{1,4})\s+(.*)$/);if(h){const lv=Math.min(h[1].length+1,5);out.push(`<h${lv}>${inline(h[2])}</h${lv}>`);continue}
    if(/^\s*(---|\*\*\*)\s*$/.test(L)){out.push('<hr>');continue}
    if(/^&gt;/.test(L)){const q=[];while(i<lines.length&&/^&gt;/.test(lines[i]))q.push(lines[i++].replace(/^&gt;\s?/,''));i--;out.push(`<blockquote>${inline(q.join('<br>'))}</blockquote>`);continue}
    if(/^\s*\|/.test(L)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(lines[i++]);i--;out.push(mdTable(rows));continue}
    const p=[L];while(i+1<lines.length&&lines[i+1].trim()&&!isBlock(lines[i+1]))p.push(lines[++i]);
    out.push(`<p>${inline(p.join('<br>'))}</p>`)}
  closeAll();return out.join('');
}
function clozeHTML(text,n,reveal){
  const toks=[];const t=String(text||'').replace(/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g,(m,num,ans,hint)=>{toks.push(+num===n?(reveal?`<span class="cz on">${esc(ans)}</span>`:`<span class="cz">[${esc(hint||'…')}]</span>`):esc(ans));return'\u0000'+(toks.length-1)+'\u0000'});
  return md(t).replace(/\u0000(\d+)\u0000/g,(m,i)=>toks[+i]);
}

$('#back').onclick=()=>history.length>1?history.back():go('#/home');
$('#searchbtn').onclick=()=>{L.focusSearch=true;go('#/lib')};
$('#exitfocus').onclick=()=>document.body.classList.remove('focus');
function render(){
  clearInterval(tick);tick=null;closeModal();TTS.stop();TTS.wake(false);document.body.classList.remove('focus','feedon');if(F.io){F.io.disconnect();F.io=null}
  const parts=(location.hash||'#/home').slice(2).split('/');const r=parts[0]||'home';
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  $('#title').textContent=TITLES[r]||'Mains';
  $('#back').classList.toggle('hide',['home','lib','add','review','syl','ideas','more'].includes(r));

  fn(v,parts.slice(1));updateBadge();
}

/* ================= Today ================= */
function vHome(v){
  const c=counts('all'),total=c.learn+c.review+c.newLeft,ex=examDays(),sk=streak();
  const dueNotes=S.notes.filter(revDue).sort((a,b)=>a.rev.next-b.rev.next);
  const backupOld=(S.notes.length+S.qas.length)>0&&Date.now()-(S.settings.lastBackup||0)>7*DAY;
  const empty=!S.notes.length&&!S.qas.length;
  const fc=[];for(let d=1;d<=7;d++){const s=dayStart()+d*DAY;fc.push(S.cards.filter(x=>!x.suspended&&x.state===2&&x.due>=s&&x.due<s+DAY).length)}
  const mx=Math.max(1,...fc);
  const tx=todayXp(),pct=Math.min(1,tx/G.goal),lv=lvl(G.xp),active=tx>0||S.logs.some(l=>l.day===dayKey());
  v.innerHTML=`
  <div class="row"><div class="muted small">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div><span class="spacer"></span>
  ${ex!=null?`<div class="small"><b>${ex}</b> <span class="muted">days to Mains</span></div>`:''}</div>
  ${empty?'':`<div class="card" style="margin-top:12px"><div class="hero"><svg class="ring" viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="27" fill="none" stroke="${pct?'var(--good)':'none'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(169.6*pct).toFixed(1)} 170" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">${Math.round(pct*100)}%</text></svg>
   <div style="flex:1"><b>${tx} / ${G.goal} XP today</b><div class="small muted">🔥 ${sk}-day streak · Level ${lv} · ${lvlXp(lv+1)-G.xp} XP to level ${lv+1}</div></div></div>
   ${sk>0&&!active?`<p class="risk">Your ${sk}-day streak ends tonight. Two minutes in the feed keeps it alive.</p>`:''}
   <a class="btn primary block" data-go="#/feed">▶ ${tx>=G.goal?'Keep the streak going':tx?'Continue revision feed':'Start revision feed'}</a></div>`}
  <div class="stats3"><div class="r"><b>${c.review}</b><span>Review</span></div><div class="l"><b>${c.learn}</b><span>Learning</span></div><div class="n"><b>${c.newLeft}</b><span>New</span></div></div>
  <a class="btn ${empty?'primary':''} block" data-go="#/review">${total?'Start flashcard review':'Flashcards: all caught up'}</a>
  <p class="small muted" style="text-align:center;margin:8px 0 18px">Reviewed today: ${c.newDone+c.revDone+S.logs.filter(l=>l.day===dayKey()&&l.prevState!==0&&l.prevState!==2).length} · Streak: ${sk} day${sk===1?'':'s'}</p>
  ${empty?`<div class="card"><h3 style="margin-top:0">Start here</h3><ol class="small" style="padding-left:18px;margin:0">
   <li>Go to <b>Add</b>, paste your raw notes or Q&amp;A.</li><li>Copy the prompt and paste it into ChatGPT / Claude / Gemini.</li>
   <li>Paste the AI's reply back — notes, model answers and flashcards are saved.</li><li>Review the due cards here every day.</li></ol>
   <div class="row" style="margin-top:12px"><a class="btn" data-go="#/add">Add content</a><a class="btn ghost" data-go="#/help">How it works</a></div></div>`:''}
  ${backupOld?`<div class="card row"><div class="small" style="flex:1">Last backup: ${ago(S.settings.lastBackup)}. Keep a copy outside the phone.</div><a class="btn" data-go="#/backup">Back up</a></div>`:''}
  ${dueNotes.length?`<h3>Notes to revise <span class="muted small">(${dueNotes.length})</span></h3><div class="card list" style="padding:2px 12px">${dueNotes.slice(0,6).map(n=>`<a class="item" data-go="#/note/${n.id}"><div class="t">${esc(n.title)}</div><div class="s">${n.paper||'—'} · revised ${n.rev.count}× · last ${ago(n.rev.last)}</div></a>`).join('')}</div>`:''}
  ${S.qas.length?`<a class="btn block" data-go="#/practice" style="margin-top:8px">Practise an answer</a>`:''}
  ${S.cards.length?`<h3>Next 7 days</h3><div class="card"><div class="bars">${fc.map((n,i)=>`<div title="${n}"><span>${n||''}</span><i style="height:${n/mx*70}px"></i><span>${new Date(dayStart()+(i+1)*DAY).toLocaleDateString('en-IN',{weekday:'narrow'})}</span></div>`).join('')}</div></div>`:''}`;

/* ================= Library ================= */
const L={tab:'notes',q:'',paper:'',sort:'recent',star:false,cstate:'',focusSearch:false};
function vLib(v,args){
  if(args[0]&&['notes','qa','cards'].includes(args[0]))L.tab=args[0];
  v.innerHTML=`
  <div class="seg" id="ltab"><button data-t="notes">Notes ${S.notes.length}</button><button data-t="qa">Q&amp;A ${S.qas.length}</button><button data-t="cards">Cards ${S.cards.length}</button></div>
  <input type="search" id="lq" placeholder="Search…" value="${esc(L.q)}">
  <div class="chips" style="margin-top:10px" id="lp"><span class="chip" data-p="">All</span>${PAPERS.map(p=>`<span class="chip" data-p="${p.id}">${p.id}</span>`).join('')}<span class="chip" data-p="★">★</span></div>
  <div class="row small" id="lopts"></div>
  <div class="card list" id="llist" style="padding:2px 12px;margin-top:8px"></div>`;
  const syncUI=()=>{$$('#ltab button').forEach(b=>b.classList.toggle('on',b.dataset.t===L.tab));$$('#lp .chip').forEach(c=>c.classList.toggle('on',L.star?c.dataset.p==='★':c.dataset.p===L.paper));
    $('#lopts').innerHTML=L.tab==='cards'?`<select id="lcs" style="width:auto;padding:6px 10px"><option value="">All states</option><option value="new">New</option><option value="due">Due today</option><option value="learn">Learning</option><option value="flag">Flagged</option><option value="leech">Leeches</option><option value="susp">Suspended</option></select><span class="spacer"></span><button class="btn" id="newcard">+ Card</button>`
      :`<select id="lsort" style="width:auto;padding:6px 10px"><option value="recent">Recently updated</option><option value="title">A–Z</option><option value="rev">Revision due</option>${L.tab==='qa'?'<option value="weak">Least practised</option>':''}</select><span class="spacer"></span><button class="btn" id="newitem">+ New</button>`;
    if($('#lcs')){$('#lcs').value=L.cstate;$('#lcs').onchange=e=>{L.cstate=e.target.value;list()};$('#newcard').onclick=()=>cardEditor(null,null)}
    if($('#lsort')){$('#lsort').value=L.sort;$('#lsort').onchange=e=>{L.sort=e.target.value;list()};$('#newitem').onclick=()=>go(L.tab==='qa'?'#/edit/qa/new':'#/edit/note/new')}};
  const list=()=>{const q=L.q.toLowerCase().trim(),el=$('#llist');let h='';
    const pOk=x=>(!L.paper||x.paper===L.paper);
    if(L.tab==='notes'){let a=S.notes.filter(n=>pOk(n)&&(!L.star||n.starred)&&(!q||[n.title,n.topic,n.summary,n.content,(n.tags||[]).join(' '),(n.keyFacts||[]).join(' ')].join(' ').toLowerCase().includes(q)));
      a.sort(L.sort==='title'?(x,y)=>x.title.localeCompare(y.title):L.sort==='rev'?(x,y)=>(x.rev?.next||0)-(y.rev?.next||0):(x,y)=>(y.updated||0)-(x.updated||0));
      h=a.map(n=>`<a class="item" data-go="#/note/${n.id}"><div class="t">${n.starred?'★ ':''}${esc(n.title)}</div><div class="s">${n.paper?`<span class="tag">${n.paper}</span>`:''}${revDue(n)?'<span class="tag">revise</span>':''}${esc(n.summary||plain(n.content).slice(0,140))}</div></a>`).join('')}
    else if(L.tab==='qa'){let a=S.qas.filter(n=>pOk(n)&&(!L.star||n.starred)&&(!q||[n.question,n.topic,n.intro,n.body,n.conclusion,(n.keywords||[]).join(' ')].join(' ').toLowerCase().includes(q)));
      const att=id=>S.attempts.filter(x=>x.qaId===id).length;
      a.sort(L.sort==='title'?(x,y)=>x.question.localeCompare(y.question):L.sort==='rev'?(x,y)=>(x.rev?.next||0)-(y.rev?.next||0):L.sort==='weak'?(x,y)=>att(x.id)-att(y.id):(x,y)=>(y.updated||0)-(x.updated||0));
      h=a.map(n=>`<a class="item" data-go="#/qa/${n.id}"><div class="t">${n.starred?'★ ':''}${esc(n.question)}</div><div class="s">${n.paper?`<span class="tag">${n.paper}</span>`:''}${n.marks?`<span class="tag">${n.marks}m</span>`:''}${att(n.id)?`<span class="tag">practised ${att(n.id)}×</span>`:''}${esc(n.topic||'')}</div></a>`).join('')}
    else{const now=Date.now(),end=dayEnd(now);let a=S.cards.filter(c=>{if(L.paper&&c.paper!==L.paper)return false;if(L.star){const s=srcOf(c);if(!s||!s.starred)return false}
        const st=L.cstate;if(st==='new'&&c.state)return false;if(st==='due'&&!(c.state&&c.due<end&&!c.suspended))return false;if(st==='learn'&&!(c.state===1||c.state===3))return false;if(st==='flag'&&!c.flagged)return false;if(st==='leech'&&!c.leech)return false;if(st==='susp'&&!c.suspended)return false;
        return!q||[c.front,c.back,c.text].join(' ').toLowerCase().includes(q)});
      a.sort((x,y)=>(y.created||0)-(x.created||0));const more=a.length>300;a=a.slice(0,300);
      h=a.map(c=>`<div class="item" data-card="${c.id}"><div class="t">${esc(plain(c.type==='cloze'?c.text:c.front).slice(0,160))}</div><div class="s">${c.paper?`<span class="tag">${c.paper}</span>`:''}<span class="tag">${c.type==='cloze'?'cloze '+c.cloze:'basic'}</span>${c.suspended?'<span class="tag">suspended</span>':!c.state?'<span class="tag">new</span>':c.state===2?`<span class="tag">due ${until(c.due)}</span>`:'<span class="tag">learning</span>'}${c.flagged?'<span class="tag">⚑</span>':''}${c.leech?'<span class="tag">leech</span>':''}</div></div>`).join('')+(more?'<p class="small muted">Showing first 300 — refine the search.</p>':'')}
    el.innerHTML=h||`<div class="empty">${q||L.paper||L.star?'Nothing matches.':'Nothing here yet. Use <a href="#/add">Add</a> to import content.'}</div>`;
    $$('[data-card]',el).forEach(x=>x.onclick=()=>cardEditor(byId('cards',x.dataset.card),null,list))};
  $$('#ltab button').forEach(b=>b.onclick=()=>{L.tab=b.dataset.t;syncUI();list()});
  $$('#lp .chip').forEach(c=>c.onclick=()=>{if(c.dataset.p==='★'){L.star=!L.star;L.paper=''}else{L.paper=c.dataset.p;L.star=false}syncUI();list()});
  $('#lq').oninput=e=>{L.q=e.target.value;list()};
  syncUI();list();if(L.focusSearch){L.focusSearch=false;$('#lq').focus()}
}

/* ================= Note view ================= */
function sec(title,body){return body?`<div class="sec"><div class="h">${title}</div>${body}</div>`:''}
const ulist=a=>a&&a.length?`<ul class="facts">${a.map(x=>`<li>${inline(esc(x))}</li>`).join('')}</ul>`:'';
function cardListHTML(id){const cs=cardsOf(id);if(!cs.length)return'<p class="small muted">No flashcards yet.</p>';
  return`<div class="list">${cs.map(c=>`<div class="item" data-card="${c.id}"><div class="t small">${esc(plain(c.type==='cloze'?c.text:c.front).slice(0,140))}</div><div class="s">${c.type==='cloze'?'cloze '+c.cloze:'basic'} · ${c.suspended?'suspended':!c.state?'new':c.state===2?'due '+until(c.due):'learning'}</div></div>`).join('')}</div>`}
function vNote(v,[id]){
  const n=byId('notes',id);if(!n){v.innerHTML='<div class="empty">Note not found.</div>';return}
  $('#title').textContent=n.paper||'Note';
  const cs=cardsOf(id);
  v.innerHTML=`<h2>${esc(n.title)}</h2>
  <div class="small muted">${esc(paperName(n.paper))}${n.topic?' · '+esc(n.topic):''}</div>
  <div style="margin-top:6px">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  <div class="actions"><button class="btn" id="star">${n.starred?'★':'☆'}</button><button class="btn" id="rev">✓ Revised</button><button class="btn" id="study">Study ${cs.length}</button><button class="btn" id="focus">Focus</button><span class="spacer"></span><button class="btn" id="more">⋯</button></div>
  <div class="small muted">Revised ${n.rev?.count||0}× · last ${ago(n.rev?.last)} · next ${n.rev?until(n.rev.next):'—'}</div>
  <div class="reading">
  ${n.summary?`<blockquote>${inline(esc(n.summary))}</blockquote>`:''}
  ${md(n.content)}
  ${sec('Key facts',ulist(n.keyFacts))}
  ${sec('Telangana angle',n.telanganaAngle?md(n.telanganaAngle):'')}
  ${sec('Memory aids',ulist(n.mnemonics))}
  ${sec('Likely questions',ulist(n.pyqs))}
  </div>
  <div class="sec"><div class="h row">Flashcards <span class="spacer"></span><button class="btn ghost" id="addcard">+ Card</button></div><div id="clist">${cardListHTML(id)}</div></div>`;
  bindNoteCommon(v,n,'notes');
}
function bindNoteCommon(v,n,store){
  const kind=store==='notes'?'note':'qa';
  const refreshCards=()=>{$('#clist').innerHTML=cardListHTML(n.id);bindCards()};
  const bindCards=()=>$$('#clist [data-card]').forEach(x=>x.onclick=()=>cardEditor(byId('cards',x.dataset.card),null,refreshCards));bindCards();
  $('#star').onclick=async()=>{n.starred=!n.starred;await upsert(store,n,false);$('#star').textContent=n.starred?'★':'☆'};
  $('#rev').onclick=async()=>{markRevised(n);await upsert(store,n,false);toast('Next revision '+until(n.rev.next));render()};
  $('#study').onclick=()=>{if(!cardsOf(n.id).length)return toast('No cards for this item');R.deck='src:'+n.id;go('#/review')};
  if($('#focus'))$('#focus').onclick=()=>{document.body.classList.add('focus');window.scrollTo(0,0)};
  $('#addcard').onclick=()=>cardEditor(null,{kind,id:n.id,paper:n.paper},refreshCards);
  $('#more').onclick=()=>modal(`<h3>${esc(kind==='note'?n.title:'Question')}</h3>
    <div style="display:grid;gap:8px"><button class="btn" data-a="edit">Edit</button><button class="btn" data-a="copy">Copy as text</button><button class="btn" data-a="pack">Export this item (shareable)</button>${kind==='qa'?'<button class="btn" data-a="practice">Practise this question</button>':''}<button class="btn" data-a="reset">Reset card progress</button><button class="btn danger" data-a="del">Delete</button><button class="btn ghost" data-close>Close</button></div>`,box=>{
    $$('[data-a]',box).forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
      if(a==='edit')go(`#/edit/${kind}/${n.id}`);
      if(a==='copy'){await copyText(kind==='note'?noteToMd(n):qaToMd(n));toast('Copied');closeModal()}
      if(a==='pack'){const p=kind==='note'?{type:'tspsc-notes',version:1,notes:[packNote(n)]}:{type:'tspsc-qa',version:1,items:[packQA(n)]};await shareFile(`${kind}-${(kind==='note'?n.title:n.question).slice(0,30).replace(/\W+/g,'-')}.json`,JSON.stringify(p,null,1));closeModal()}
      if(a==='practice'){P.qa=n.id;P.phase='ready';go('#/practice')}
      if(a==='reset'){if(!confirm('Reset review progress for all cards of this item?'))return;const cs=cardsOf(n.id).map(c=>resetCard(c));await upsertMany('cards',cs);toast('Progress reset');closeModal();render()}
      if(a==='del'){if(!confirm('Delete this item and its '+cardsOf(n.id).length+' cards?'))return;await removeMany('cards',cardsOf(n.id).map(c=>c.id));await removeMany(store,[n.id]);toast('Deleted');closeModal();go(kind==='note'?'#/lib/notes':'#/lib/qa')}})});
}
function vQA(v,[id]){
  const q=byId('qas',id);if(!q){v.innerHTML='<div class="empty">Question not found.</div>';return}
  $('#title').textContent=(q.paper||'Question')+(q.marks?` · ${q.marks} marks`:'');
  const atts=S.attempts.filter(a=>a.qaId===id).sort((a,b)=>b.t-a.t);
  v.innerHTML=`<h2 style="line-height:1.4">${esc(q.question)}</h2>
  <div class="small muted">${esc(paperName(q.paper))}${q.topic?' · '+esc(q.topic):''}${q.wordLimit?' · '+q.wordLimit+' words':''}${q.directive?' · <b>'+esc(q.directive)+'</b>':''}</div>
  <div class="actions"><button class="btn" id="star">${q.starred?'★':'☆'}</button><button class="btn" id="rev">✓ Revised</button><button class="btn" id="test">Test me</button><button class="btn" id="study">Cards ${cardsOf(id).length}</button><span class="spacer"></span><button class="btn" id="more">⋯</button></div>
  ${q.keywords?.length?`<div style="margin-bottom:8px">${q.keywords.map(k=>`<span class="tag" style="font-size:12px">${esc(k)}</span>`).join('')}</div>`:''}
  <div class="reading" id="ans">
  ${sec('Introduction',q.intro?md(q.intro):'')}
  ${sec('Body',md(q.body))}
  ${sec('Conclusion',q.conclusion?md(q.conclusion):'')}
  ${sec('Diagram',q.diagram?md(q.diagram):'')}
  ${sec('Value additions',ulist(q.valueAdd))}
  </div>
  ${atts.length?sec('Your attempts',`<table class="t">${atts.slice(0,8).map(a=>`<tr><td>${fmtDate(a.t)}</td><td>${Math.round(a.secs/60)} min</td><td>${a.words?a.words+' words':'on paper'}</td><td class="n">${a.score?a.score+'/10':'—'}</td></tr>`).join('')}</table>`):''}
  <div class="sec"><div class="h row">Flashcards <span class="spacer"></span><button class="btn ghost" id="addcard">+ Card</button></div><div id="clist">${cardListHTML(id)}</div></div>`;
  bindNoteCommon(v,q,'qas');
  $('#test').onclick=()=>{const a=$('#ans');a.classList.toggle('blur');$('#test').textContent=a.classList.contains('blur')?'Show answer':'Test me'};
  $('#ans').addEventListener('click',()=>{if($('#ans').classList.contains('blur')){$('#ans').classList.remove('blur');$('#test').textContent='Test me'}});
}

/* ================= Editors ================= */
function vEdit(v,[kind,id]){
  const isNew=id==='new';
  if(kind==='note'){
    const n=isNew?{title:'',paper:L.paper||'',topic:'',tags:[],summary:'',content:'',keyFacts:[],telanganaAngle:'',mnemonics:[],pyqs:[]}:byId('notes',id);if(!n)return v.innerHTML='<div class="empty">Not found</div>';
    v.innerHTML=`<label>Title</label><input type="text" id="f_title" value="${esc(n.title)}">
    <label>Paper</label><select id="f_paper">${paperOpts(n.paper)}</select>
    <label>Topic / section</label><input type="text" id="f_topic" value="${esc(n.topic)}">
    <label>Tags (comma separated)</label><input type="text" id="f_tags" value="${esc((n.tags||[]).join(', '))}">
    <label>Summary (2–3 lines)</label><textarea id="f_summary" rows="3">${esc(n.summary)}</textarea>
    <label>Notes — Markdown: ## heading, - bullet, **bold**, ==highlight==, | table |</label><textarea id="f_content" class="tall">${esc(n.content)}</textarea>
    <label>Key facts (one per line)</label><textarea id="f_facts">${esc((n.keyFacts||[]).join('\n'))}</textarea>
    <label>Telangana angle</label><textarea id="f_tg" rows="3">${esc(n.telanganaAngle)}</textarea>
    <label>Memory aids (one per line)</label><textarea id="f_mn" rows="3">${esc((n.mnemonics||[]).join('\n'))}</textarea>
    <label>Likely questions (one per line)</label><textarea id="f_pyq" rows="3">${esc((n.pyqs||[]).join('\n'))}</textarea>
    <div class="row end" style="margin-top:16px"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save</button></div>`;
    $('#cancel').onclick=()=>history.back();
    $('#save').onclick=async()=>{const t=$('#f_title').value.trim();if(!t)return toast('Title is required');
      const o=isNew?{id:uid(),created:Date.now(),starred:false,rev:freshRev()}:n;const oldPaper=o.paper;
      Object.assign(o,{title:t,paper:$('#f_paper').value,topic:$('#f_topic').value.trim(),tags:$('#f_tags').value.split(',').map(s=>s.trim()).filter(Boolean),summary:$('#f_summary').value.trim(),content:$('#f_content').value,keyFacts:arr($('#f_facts').value),telanganaAngle:$('#f_tg').value.trim(),mnemonics:arr($('#f_mn').value),pyqs:arr($('#f_pyq').value)});
      await upsert('notes',o);if(!isNew&&oldPaper!==o.paper)await upsertMany('cards',cardsOf(o.id).map(c=>({...c,paper:o.paper})));
      toast('Saved');location.replace('#/note/'+o.id)};
  }else{
    const q=isNew?{question:'',paper:L.paper||'',topic:'',tags:[],marks:'',wordLimit:'',directive:'',keywords:[],intro:'',body:'',conclusion:'',diagram:'',valueAdd:[]}:byId('qas',id);if(!q)return v.innerHTML='<div class="empty">Not found</div>';

function deckOptions(){const o=[['all','All cards'],...PAPERS.filter(p=>S.cards.some(c=>c.paper===p.id)).map(p=>[p.id,p.id+' · '+p.name.replace(/^Paper \w+ · /,'')]),...(S.cards.some(c=>c.sourceType==='deck')?[['aw','Answer-writing deck']]:[]),['star','Starred notes & Q&A'],['flag','Flagged cards']];

  return o.map(([v,l])=>{const c=counts(v);const n=c.learn+c.review+c.newLeft;return`<option value="${v}" ${v===R.deck?'selected':''}>${esc(l)}${n?' ('+n+')':''}</option>`}).join('')}
function nextCard(){
  const now=Date.now(),end=dayEnd(now),pool=deckCards(R.deck).filter(c=>!c.suspended);
  const notLast=a=>a.find(c=>(c.group||c.id)!==R.lastGroup)||a[0]||null;
  const lrn=pool.filter(c=>(c.state===1||c.state===3)&&c.due<=now).sort((a,b)=>a.due-b.due);
  if(lrn.length)return lrn[0];
  const k=counts(R.deck,now);
  const revs=k.review?pool.filter(c=>c.state===2&&c.due<end).sort((a,b)=>FS.R((now-a.last)/DAY,a.stability)-FS.R((now-b.last)/DAY,b.stability)).slice(0,k.review):[];
  const news=k.newLeft?pool.filter(c=>!c.state).sort((a,b)=>(a.created-b.created)||(a.cloze-b.cloze)).slice(0,Math.max(k.newLeft,5)):[];
  if(revs.length&&news.length)return Math.random()<k.newLeft/(k.newLeft+k.review)?notLast(news):notLast(revs);
  if(revs.length)return notLast(revs);if(news.length)return notLast(news);
  return pool.filter(c=>(c.state===1||c.state===3)&&c.due<=now+20*MIN).sort((a,b)=>a.due-b.due)[0]||null;
}

async function answer(g,v){

function startCram(){const now=Date.now();const pool=deckCards(R.deck).filter(c=>!c.suspended&&c.state);

function vCram(v){

/* ================= Revision feed ================= */
const F={slides:[],order:[],oi:0,combo:0,xp:0,retry:[],io:null};
function chunks(src,max=650){const out=[];
  for(const p of String(src||'').split(/\n(?=#{1,4}\s)/)){if(!p.trim())continue;if(p.length<=max){out.push(p);continue}
    let cur='';for(const line of p.split('\n')){if(cur&&cur.length+line.length>max){out.push(cur);cur=''}cur+=(cur?'\n':'')+line}if(cur.trim())out.push(cur)}
  return out}
function feedOrder(){const seen=G.seen,t=x=>seen[x.id]||0;
  const notes=S.notes.slice().sort((a,b)=>(revDue(b)-revDue(a))||(t(a)-t(b))||((a.rev?.last||0)-(b.rev?.last||0)));
  const qas=S.qas.slice().sort((a,b)=>t(a)-t(b));const out=[];let qi=0;
  notes.forEach((n,i)=>{out.push({kind:'note',x:n});if(i%2===1&&qi<qas.length)out.push({kind:'qa',x:qas[qi++]})});
  while(qi<qas.length)out.push({kind:'qa',x:qas[qi++]});return out}
function noteSlides(n){const read=[],T=n.title,id=n.id;
  read.push({k:'read',tag:'New topic',title:paperName(n.paper),html:`<h2 style="margin-top:0">${esc(T)}</h2>${n.summary?`<blockquote>${inline(esc(n.summary))}</blockquote>`:''}${n.topic?`<p class="small muted">${esc(n.topic)}</p>`:''}`});
  for(const c of chunks(n.content))read.push({k:'read',title:T,html:md(c)});
  const kf=n.keyFacts||[];for(let i=0;i<kf.length;i+=4)read.push({k:'read',tag:'Key facts',title:T,html:ulist(kf.slice(i,i+4))});
  if(n.telanganaAngle)read.push({k:'read',tag:'Telangana angle',title:T,html:md(n.telanganaAngle)});
  if(n.mnemonics?.length)read.push({k:'read',tag:'Memory aid',title:T,html:ulist(n.mnemonics)});
  if(n.pyqs?.length)read.push({k:'read',tag:'Could you answer this?',title:T,html:ulist(n.pyqs.slice(0,3))});
  const qs=cardsOf(id).filter(c=>!c.suspended).sort((a,b)=>(curR(a)??0)-(curR(b)??0)).slice(0,4).map(c=>({k:'quiz',tag:'Quick check',card:c}));
  const out=[];read.forEach((s,i)=>{out.push(s);if(i%2===1&&qs.length)out.push(qs.shift())});out.push(...qs);
  out.push({k:'done',nid:id,title:T});return out}
function qaSlides(q){const oc=qaOutlineCard(q,0);
  const out=[{k:'quiz',tag:'Answer recall'+(q.marks?` · ${q.marks} marks`:''),card:oc}];
  for(const c of chunks(q.body).slice(0,3))out.push({k:'read',tag:'Model answer',title:q.question,html:md(c)});
  if(q.conclusion)out.push({k:'read',tag:'Way ahead',title:q.question,html:md(q.conclusion)});return out}
function flashback(skip){const pool=S.cards.filter(c=>c.state&&!c.suspended&&c.sourceId!==skip).sort((a,b)=>(curR(a)??0)-(curR(b)??0)).slice(0,25);
  return pool.length?{k:'quiz',tag:'Flashback',card:pool[Math.floor(Math.random()*pool.length)]}:null}
function slideHTML(s,i){
  const tag=(s.bonus?'⚡ 2× bonus · ':'')+(s.tag||'');
  const head=`${tag?`<div class="ftag">${esc(tag)}</div>`:''}${s.title&&s.k!=='done'?`<div class="ftitle">${esc(s.title)}</div>`:''}`;
  let body;
  if(s.k==='quiz')body=`<div class="flash qface">${cardFace(s.card,false)}</div><div class="qctl"><button class="btn primary block" data-act="reveal">Tap to reveal</button></div>`;
  else if(s.k==='done'){const n=byId('notes',s.nid),today=n&&n.rev?.last>=dayStart();
    body=`<div class="empty" style="color:var(--ink);padding:16px 0"><div style="font-size:40px">✓</div><h3 style="margin:6px 0">Topic finished</h3><p class="small muted">${esc(s.title)}</p>
    ${today?'<p class="small">Already revised today.</p>':'<button class="btn primary" data-act="rev">Mark revised · +15 XP</button>'}<div class="swipe">Swipe up for the next topic ↑</div></div>`}
  else body=`<div class="reading">${s.html}</div>`;
  return`<section class="fs${s.bonus?' bonus':''}" data-i="${i}"><div class="fs-in">${head}${body}${i===0?'<div class="swipe">Swipe up ↑</div>':''}</div></section>`}
function updHud(){const t=todayXp();if(!$('#gfill'))return;$('#gfill').style.width=Math.min(100,t/G.goal*100)+'%';$('#hxp').textContent=`${t} / ${G.goal} XP`;
  const m=feedMult();$('#hcombo').textContent=F.combo>=2?`🔥×${m}`:''}
const feedMult=()=>Math.min(5,1+Math.floor(F.combo/3));
function gain(n,s){const x=award(n*(s.bonus?2:1));F.xp+=x;floatXp(x,s.bonus);updHud();return x}
function feedMore(){
  if(F.oi>=F.order.length){F.order=feedOrder();F.oi=0;if(!F.order.length)return}
  const it=F.order[F.oi++];G.seen[it.x.id]=Date.now();
  const batch=it.kind==='note'?noteSlides(it.x):qaSlides(it.x);
  if(F.retry.length)batch.splice(Math.min(2,batch.length),0,...F.retry.splice(0,2));
  if(Math.random()<.5){const fb=flashback(it.x.id);if(fb)batch.splice(Math.min(3,batch.length),0,fb)}
  for(const s of batch)if(s.k!=='done'&&Math.random()<.12)s.bonus=true;
  const start=F.slides.length;F.slides.push(...batch);
  $('#fslides').insertAdjacentHTML('beforeend',batch.map((s,j)=>slideHTML(s,start+j)).join(''));
  $$('#fslides .fs').slice(start).forEach(el=>F.io.observe(el))}
function vFeed(v){
  document.body.classList.add('focus','feedon');
  if(!S.notes.length&&!S.qas.length){v.innerHTML=`<div class="empty">Add some notes first — the feed is built from them.</div><a class="btn primary block" data-go="#/add">Add content</a>`;document.body.classList.remove('focus','feedon');return}
  Object.assign(F,{slides:[],order:feedOrder(),oi:0,combo:0,xp:0,retry:[]});
  v.innerHTML=`<div class="feed" id="feed"><div class="hud"><button class="iconbtn" id="fx" aria-label="Close feed"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="gbar"><i id="gfill"></i></div><span class="cnt" id="hxp"></span><span class="combo" id="hcombo"></span></div><div id="fslides"></div></div>`;
  F.io=new IntersectionObserver(es=>{for(const e of es){const i=+e.target.dataset.i,s=F.slides[i];if(!s)continue;
    if(e.isIntersecting){F.cur=i;clearTimeout(s._t);
      if(s.k!=='quiz'&&!s.got)s._t=setTimeout(()=>{if(!location.hash.startsWith('#/feed')||s.got)return;s.got=true;gain(s.k==='done'?3:2,s)},1300);
      if(i>=F.slides.length-4)feedMore()}
    else clearTimeout(s._t)}},{root:$('#feed'),threshold:.6});
  feedMore();if(F.slides.length<6)feedMore();updHud();
  $('#fx').onclick=()=>{if(F.xp)toast(`+${F.xp} XP this session`);go('#/home')};
  $('#fslides').addEventListener('click',async e=>{const sec=e.target.closest('.fs');if(!sec)return;const s=F.slides[+sec.dataset.i];
    const b=e.target.closest('[data-act]'),act=b?b.dataset.act:(s.k==='quiz'&&!s.revealed&&e.target.closest('.qface')?'reveal':null);if(!act)return;
    const ctl=$('.qctl',sec),next=()=>setTimeout(()=>sec.nextElementSibling?.scrollIntoView({behavior:'smooth'}),650);
    if(act==='reveal'&&!s.revealed){s.revealed=true;$('.qface',sec).innerHTML=cardFace(s.card,true);
      ctl.innerHTML=`<div class="grades"><button class="g1" data-act="miss"><b>Missed</b><small>see it again</small></button><button class="g3" data-act="knew"><b>Knew it</b><small>+${8*feedMult()*(s.bonus?2:1)} XP</small></button></div>`}
    else if(act==='knew'&&!s.done){s.done=true;F.combo++;const x=gain(8*feedMult(),s);navigator.vibrate?.(12);
      if(F.combo>(G.best||0)){G.best=F.combo;if(F.combo>=5&&F.combo%5===0)celebrate(`${F.combo} in a row — new best!`,'🔥')}else if(F.combo%5===0)toast(`🔥 ${F.combo} in a row`);
      ctl.innerHTML=`<div class="ok">✓ +${x} XP${F.combo>=2?` · ${F.combo} in a row`:''}</div>`;updHud();next()}
    else if(act==='miss'&&!s.done){s.done=true;F.combo=0;gain(1,s);F.retry.push({k:'quiz',tag:'Try again',card:s.card});
      ctl.innerHTML=`<div class="ok" style="color:var(--muted)">It will come back in a few cards.</div>`;updHud();next()}
    else if(act==='rev'){const n=byId('notes',s.nid);if(!n)return;markRevised(n);await upsert('notes',n,false);gain(15,s);b.outerHTML=`<p class="small">✓ Revised · next ${until(n.rev.next)}</p>`;next()}});
}

  <div class="row"><div style="flex:1"><label>New cards / day</label><input type="number" id="np" value="${s.newPerDay}" min="0"></div><div style="flex:1"><label>Max reviews / day</label><input type="number" id="rp" value="${s.reviewsPerDay}" min="0"></div></div>
  <div class="row"><div style="flex:1"><label>Learning steps (minutes)</label><input type="text" id="ls" value="${s.learnSteps.join(' ')}"></div><div style="flex:1"><label>Relearning steps</label><input type="text" id="rls" value="${s.relearnSteps.join(' ')}"></div></div>
  <div class="row"><div style="flex:1"><label>Maximum interval (days)</label><input type="number" id="mi" value="${s.maxIvl}" min="1"></div><div style="flex:1"><label>New day starts at (hour)</label><input type="number" id="ro" value="${s.rollover}" min="0" max="12"></div></div>
  <div class="switch"><span>Interval fuzz (spreads reviews out)</span><input type="checkbox" id="fz" ${s.fuzz?'checked':''}></div>
  <div class="switch"><span>Auto “recall the outline” card for each new question</span><input type="checkbox" id="aq" ${s.autoQaCards?'checked':''}></div>
  <h3>Revision feed</h3><label>Daily XP goal (about 1 XP per 3 seconds of focused revision)</label><input type="number" id="xg" value="${G.goal}" min="20" step="10">
  <h3>Answer practice</h3><label>Minutes per mark</label><input type="number" id="mpm" step="0.1" value="${s.minPerMark}">
  <div class="row end" style="margin-top:16px"><button class="btn primary" id="ssave">Save settings</button></div>
  <h3>Reset</h3><div class="row"><button class="btn" id="rprog">Reset all review progress</button><button class="btn danger" id="wipe">Delete everything</button></div>`;
  let theme=s.theme;const sth=()=>$$('#th button').forEach(b=>b.classList.toggle('on',b.dataset.t===theme));sth();
  $$('#th button').forEach(b=>b.onclick=()=>{theme=b.dataset.t;sth();S.settings.theme=theme;applyTheme()});
  $('#fs').oninput=e=>{$('#fsv').textContent=e.target.value+'px';document.documentElement.style.setProperty('--fs',e.target.value+'px')};
  $('#rt').oninput=e=>$('#rtv').textContent=e.target.value+'%';
  const steps=t=>t.split(/[\s,]+/).map(Number).filter(n=>n>0);
  $('#ssave').onclick=async()=>{Object.assign(S.settings,{theme,fontSize:+$('#fs').value,examDate:$('#ex').value,retention:+$('#rt').value/100,newPerDay:Math.max(0,+$('#np').value||0),reviewsPerDay:Math.max(0,+$('#rp').value||0),learnSteps:steps($('#ls').value),relearnSteps:steps($('#rls').value),maxIvl:Math.max(1,+$('#mi').value||365),rollover:clamp(+$('#ro').value||0,0,12),fuzz:$('#fz').checked,autoQaCards:$('#aq').checked,minPerMark:Math.max(.2,+$('#mpm').value||1.2)});G.goal=Math.max(20,+$('#xg').value||150);await saveG();await saveSettings();toast('Settings saved');updateBadge()};
  $('#rprog').onclick=async()=>{if(!confirm('Reset every card to new and clear review history? Content stays.'))return;await upsertMany('cards',S.cards.map(resetCard));S.logs=[];await DB.clear('logs');toast('Progress reset');updateBadge()};
  $('#wipe').onclick=async()=>{if(!confirm('Delete ALL notes, questions, cards and history? Make a backup first.'))return;if(prompt('Type DELETE to confirm')!=='DELETE')return;for(const st of['notes','qas','cards','logs','attempts','ideas']){S[st]=[];await DB.clear(st)}toast('Everything deleted');go('#/home')};

function noteToMd(n){return`# ${n.title}\n*${paperName(n.paper)}${n.topic?' · '+n.topic:''}*\n\n${n.summary?'> '+n.summary+'\n\n':''}${n.content||''}\n${n.keyFacts?.length?'\n## Key facts\n'+n.keyFacts.map(x=>'- '+x).join('\n')+'\n':''}${n.telanganaAngle?'\n## Telangana angle\n'+n.telanganaAngle+'\n':''}${n.mnemonics?.length?'\n## Memory aids\n'+n.mnemonics.map(x=>'- '+x).join('\n')+'\n':''}${n.pyqs?.length?'\n## Likely questions\n'+n.pyqs.map(x=>'- '+x).join('\n')+'\n':''}`}
function qaToMd(q){return`## Q. ${q.question}\n*${paperName(q.paper)}${q.marks?' · '+q.marks+' marks':''}${q.wordLimit?' · '+q.wordLimit+' words':''}*\n\n${q.keywords?.length?'**Keywords:** '+q.keywords.join(', ')+'\n\n':''}${q.intro?q.intro+'\n\n':''}${q.body||''}\n\n${q.conclusion||''}\n${q.diagram?'\n**Diagram:** '+q.diagram+'\n':''}${q.valueAdd?.length?'\n**Value additions:**\n'+q.valueAdd.map(x=>'- '+x).join('\n')+'\n':''}`}
const cardRaw=id=>cardsOf(id).filter(c=>!c.group?.startsWith('outline-')).reduce((a,c)=>{if(c.type==='cloze'){if(!a.seen.has(c.group)){a.seen.add(c.group);a.l.push({type:'cloze',text:c.text,back:c.back})}}else a.l.push({type:'basic',front:c.front,back:c.back});return a},{seen:new Set(),l:[]}).l;
function packNote(n){return{title:n.title,paper:n.paper,topic:n.topic,tags:n.tags,summary:n.summary,content:n.content,keyFacts:n.keyFacts,telanganaAngle:n.telanganaAngle,mnemonics:n.mnemonics,pyqs:n.pyqs,cards:cardRaw(n.id)}}
function packQA(q){return{question:q.question,paper:q.paper,topic:q.topic,tags:q.tags,marks:q.marks,wordLimit:q.wordLimit,directive:q.directive,keywords:q.keywords,answer:{intro:q.intro,body:q.body,conclusion:q.conclusion},diagram:q.diagram,valueAdd:q.valueAdd,cards:cardRaw(q.id)}}
function vBackup(v){
  v.innerHTML=`<div class="card"><b>Full backup</b><p class="small muted" style="margin:4px 0 10px">Everything — notes, Q&amp;A, cards, ideas, review history, attempts and settings. Last backup: ${ago(S.settings.lastBackup)}.</p>
   <div class="row"><button class="btn primary" id="bdl">Download</button><button class="btn" id="bsh">Share (Drive, WhatsApp…)</button></div></div>
  <div class="card"><b>Restore / import a file</b><p class="small muted" style="margin:4px 0 10px">Accepts a full backup, a shared notes/Q&amp;A pack, or a saved AI reply.</p><button class="btn" id="bimp">Choose file</button></div>
  <div class="card"><b>Export content</b><label>Paper</label><select id="bpaper">${paperOpts('','All papers')}</select>
   <div style="display:grid;gap:8px;margin-top:10px"><button class="btn" id="bpack">Shareable pack (.json, re-importable)</button><button class="btn" id="bmd">Readable notes (.md)</button><button class="btn" id="banki">Flashcards for Anki (.txt)</button></div>
   <p class="small muted">Anki: File → Import, separator Tab, allow HTML. Cloze rows go into a Cloze note type.</p></div>`;
  const full=()=>JSON.stringify({type:'tspsc-backup',version:1,exported:Date.now(),settings:S.settings,game:G,notes:S.notes,qas:S.qas,cards:S.cards,logs:S.logs,attempts:S.attempts,ideas:S.ideas});
  const mark=async()=>{S.settings.lastBackup=Date.now();await saveSettings()};
  $('#bdl').onclick=async()=>{download(`mains-backup-${stamp()}.json`,full());await mark();toast('Backup saved to Downloads')};
  $('#bsh').onclick=async()=>{await shareFile(`mains-backup-${stamp()}.json`,full());await mark()};
  const sel=()=>$('#bpaper').value,f=x=>!sel()||x.paper===sel(),tag=()=>sel()||'all';
  $('#bpack').onclick=()=>{const notes=S.notes.filter(f),qas=S.qas.filter(f);if(!notes.length&&!qas.length)return toast('Nothing to export');
    const out=[];if(notes.length)out.push({type:'tspsc-notes',version:1,notes:notes.map(packNote)});if(qas.length)out.push({type:'tspsc-qa',version:1,items:qas.map(packQA)});
    download(`mains-pack-${tag()}-${stamp()}.json`,JSON.stringify(out.length===1?out[0]:out,null,1))};
  $('#bmd').onclick=()=>{const notes=S.notes.filter(f).sort((a,b)=>(a.paper+a.title).localeCompare(b.paper+b.title)),qas=S.qas.filter(f);if(!notes.length&&!qas.length)return toast('Nothing to export');
    download(`mains-notes-${tag()}-${stamp()}.md`,notes.map(noteToMd).join('\n---\n\n')+(qas.length?'\n\n# Questions & answers\n\n'+qas.map(qaToMd).join('\n---\n\n'):''),'text/markdown')};
  $('#banki').onclick=()=>{const cs=S.cards.filter(f);if(!cs.length)return toast('No cards');const seen=new Set();const cl=s=>md(s).replace(/\t/g,' ').replace(/\n/g,'');
    const rows=['#separator:tab','#html:true','#tags column:3'];for(const c of cs){if(c.type==='cloze'){if(seen.has(c.group))continue;seen.add(c.group);rows.push([String(c.text).replace(/[\t\n]/g,' '),cl(c.back||''),'tspsc '+(c.paper||'')].join('\t'))}else rows.push([cl(c.front),cl(c.back),'tspsc '+(c.paper||'')].join('\t'))}
    download(`mains-anki-${tag()}-${stamp()}.txt`,rows.join('\n'),'text/plain')};
  $('#bimp').onclick=async()=>{const fl=await readFile('.json,.txt,application/json,text/plain');if(!fl)return;let o=null;try{o=JSON.parse(fl.text)}catch(e){}
    if(o&&o.type==='tspsc-backup'){const rep=confirm(`Backup from ${fmtDate(o.exported)}: ${o.notes.length} notes, ${o.qas.length} questions, ${o.cards.length} cards.\n\nOK = REPLACE everything on this phone\nCancel = MERGE (keep newer versions)`);
      for(const st of['notes','qas','cards','logs','attempts','ideas']){const inc=o[st]||[];if(rep){await DB.clear(st);S[st]=[];await upsertMany(st,inc)}else{const cur=new Map(S[st].map(x=>[x.id,x]));const take=inc.filter(x=>!cur.has(x.id)||(x.updated||0)>(cur.get(x.id).updated||0)||(st==='cards'&&(x.reps||0)>(cur.get(x.id).reps||0)));await upsertMany(st,take)}}
      if(rep&&o.settings){S.settings={...DEF,...o.settings};await saveSettings()}
      if(o.game){if(rep)G={...G,...o.game};else{for(const[k,x]of Object.entries(o.game.days||{}))G.days[k]=Math.max(G.days[k]||0,x);G.xp=Math.max(G.xp,o.game.xp||0)}await saveG()}toast('Backup restored');go('#/home');return}
    try{const prep=prepareImport(parseAI(fl.text),'');const n=prep.notes.length+prep.qas.length;if(!confirm(`Import ${prep.notes.length} notes and ${prep.qas.length} questions?`+(prep.notes.concat(prep.qas).some(x=>x._dup)?' Existing items with the same title/question will be updated.':'')))return;const r=await commitImport(prep);toast(`Imported ${n} items, ${r.nC} cards`)}catch(e){toast(e.message,4000)}};
}
function vHelp(v){
  v.innerHTML=`<div class="reading" style="font-size:15px">
  <h3>Daily routine (under 2 hours)</h3><ol><li><b>Review</b> due cards first (10–25 min). Do it every day — skipping days is what breaks spaced repetition.</li><li><b>Revise</b> the notes listed under “Notes to revise”, tap <b>✓ Revised</b>. Notes come back after 1, 3, 7, 14, 30, 60, 120 days.</li><li><b>Practise</b> one timed answer.</li><li><b>Add</b> today’s new material.</li></ol>
  <h3>Revision feed</h3><p>Tap <b>▶ Start revision feed</b> on Today and swipe up. Your notes come in short chunks, mixed with quick recall checks. Notes due for revision come first. You earn XP for reading (stay on a card for a moment) and more for each check you get right. Get several right in a row for a 🔥 multiplier (up to ×5). Gold cards give 2× XP. Cards you miss come back a few slides later. Hit your daily XP goal to keep the streak alive. The feed does not change flashcard schedules; only <b>Mark revised</b> updates a note's revision date.</p>
  <h3>Adding content</h3><p>Paste raw notes or Q&amp;A → copy the prompt → paste it in any AI → paste the reply back → <b>Check &amp; preview</b> → Save. Flashcards in the reply are created automatically. The app tolerates extra text around the JSON and can read several JSON blocks in one reply.</p>
  <p><b>Bulk notes:</b> paste a whole chapter or a PDF's text at once. Long text is split into parts at headings / topic breaks (questions stay with their answers, at most 8 per part). Copy part 1, paste the AI's reply, save — the app ticks it off and moves to the next part. Change the part size if your AI cuts replies short.</p>
  <h3>The four buttons</h3><ul><li><b>Again</b> — forgot. Card comes back in minutes.</li><li><b>Hard</b> — recalled with real effort.</li><li><b>Good</b> — recalled correctly. Use this most.</li><li><b>Easy</b> — instant. Use sparingly.</li></ul>
  <p>Scheduling uses <b>FSRS</b> (the algorithm in modern Anki): it estimates each card’s memory stability and schedules it just before you would forget, at the recall rate you set (default 90%). Keyboard: Space = show / Good, 1–4 = grades.</p>
  <h3>Good cards</h3><ul><li>One fact per card; keep backs short.</li><li>Cloze for dates, articles, numbers: “Article {{c1::371D}} — special provisions for Andhra Pradesh”.</li><li>A card you keep failing becomes a <b>leech</b> — rewrite or split it (Library → Cards → Leeches).</li></ul>
  <h3>Before the exam</h3><p>Set the exam date in Settings — no card is scheduled after it. Use <b>Quick revision</b> on the Review screen to run through your weakest cards without changing schedules.</p>
  <h3>Keep your data safe</h3><p>Everything is stored on this phone only. Download a backup weekly (More → Backup) and keep it in Drive.</p></div>`;
}

const awHave=id=>S.cards.filter(c=>c.sourceType==='deck'&&c.sourceId===id);
async function awInstall(ids){let n=0;const out=[];const t0=Date.now();
  for(const id of ids){const d=AW.find(x=>x.id===id);const raw=awCards(d),have=awHave(id);
    const keys=new Set(have.map(c=>plain(c.type==='cloze'?c.text+'#'+c.cloze:c.front).toLowerCase()));
    for(const c of cardsFromRaw(raw,{kind:'deck',id,paper:d.paper},t0+n)){const k=plain(c.type==='cloze'?c.text+'#'+c.cloze:c.front).toLowerCase();if(keys.has(k))continue;keys.add(k);out.push(c);n++}}
  if(out.length)await upsertMany('cards',out);return n}

/* ================= Read aloud (TTS) for review ================= */
const TTS={tok:0,lock:null,
  ok:()=>'speechSynthesis'in window,
  voices(){return this.ok()?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)):[]},
  voice(){const vs=this.voices(),s=S.settings.ttsVoice;return vs.find(v=>v.voiceURI===s)||vs.find(v=>/en[-_]IN/i.test(v.lang))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs[0]||null},
  clean(t){return plain(String(t||'').replace(/\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g,'$1'))
    .replace(/\bArts?\.\s*/g,m=>/s/.test(m[3])?'Articles ':'Article ').replace(/\s&\s/g,' and ').replace(/→/g,' leads to ').replace(/(\d)\s*[–-]\s*(\d)/g,'$1 to $2').replace(/±/g,' plus or minus ').replace(/₹\s?/g,'rupees ').replace(/·/g,', ').replace(/\[verify[^\]]*\]/gi,'').replace(/\s+/g,' ').trim()},
  // Chrome cuts long utterances; speak sentence-sized chunks one after another.
  say(text,done){if(!this.ok())return;const tok=++this.tok;speechSynthesis.cancel();
    const parts=this.clean(text).match(/[^.!?;:]+[.!?;:]*\s*/g)||[];const chunks=[];
    for(const p of parts){const l=chunks[chunks.length-1];if(l&&(l+p).length<180)chunks[chunks.length-1]=l+p;else chunks.push(p)}
    const next=i=>{if(tok!==this.tok)return;if(i>=chunks.length){done&&done();return}
      const u=new SpeechSynthesisUtterance(chunks[i]);const vo=this.voice();if(vo){u.voice=vo;u.lang=vo.lang}else u.lang='en-IN';u.rate=S.settings.ttsRate||1;
      u.onend=()=>next(i+1);u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')next(i+1)};speechSynthesis.speak(u)};
    if(!chunks.length){done&&done();return}next(0)},
  stop(){this.tok++;clearTimeout(this.t);if(this.ok())speechSynthesis.cancel();VC.stop()},
  async wake(on){try{if(on&&!this.lock&&navigator.wakeLock)this.lock=await navigator.wakeLock.request('screen');else if(!on&&this.lock){await this.lock.release();this.lock=null}}catch(e){}}
};
if(TTS.ok())speechSynthesis.onvoiceschanged=()=>{};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(S.settings.tts||S.settings.voiceCmd)&&location.hash.startsWith('#/review')){TTS.lock=null;TTS.wake(true)}});
// What to say for the question side and the answer side of a card.
function cardSpeech(c,reveal){
  if(c.type==='cloze'){
    if(!reveal)return String(c.text||'').replace(/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g,(m,n,a,h)=>+n===c.cloze?(h?` blank, hint: ${h}. `:' blank '):a);
    const ans=[...String(c.text).matchAll(/\{\{c(\d+)::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g)].filter(m=>+m[1]===c.cloze).map(m=>m[2]).join(', ');
    return'Answer: '+ans+'. '+(c.back?c.back:'')}
  return reveal?(c.back||''):(c.front||'')}
function ttsModal(after){
  const s=S.settings,vs=TTS.voices(),cur=TTS.voice();
  modal(`<h3>Voice mode</h3>${TTS.ok()?'':'<p class="small" style="color:var(--again)">This browser has no speech support. Use Chrome.</p>'}
    <div class="switch"><span>Read cards aloud in Review</span><input type="checkbox" id="t_on" ${s.tts?'checked':''}></div>
    <div class="switch"><span>Rate by speaking (voice commands)</span><input type="checkbox" id="t_vc" ${s.voiceCmd?'checked':''} ${VC.ok()?'':'disabled'}></div>
    <p class="small muted" style="margin:6px 0 0">${VC.ok()?'After the answer, say <b>Again</b>, <b>Hard</b>, <b>Good</b> or <b>Easy</b> (or 1–4). Before it, say <b>Show</b>; say <b>Repeat</b> to hear the card again. In Quick revision say <b>Got it</b> or <b>Missed</b>. Needs internet and microphone permission; anything unclear is ignored, never guessed.':'Voice commands need Chrome (this browser has no speech recognition).'}</p>
    <label>Voice</label><select id="t_v">${vs.length?vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&v.voiceURI===cur.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option value="">Default</option>'}</select>
    <label>Speed: <b id="t_rv">${s.ttsRate||1}×</b></label><input type="range" id="t_r" min="0.6" max="1.6" step="0.1" value="${s.ttsRate||1}" style="width:100%">
    <label>Hands-free: show the answer automatically after</label><select id="t_a">${[[0,'Off — I tap Show answer'],[3,'3 seconds'],[5,'5 seconds'],[8,'8 seconds'],[12,'12 seconds'],[20,'20 seconds']].map(([k,l])=>`<option value="${k}" ${+k===+(s.ttsAuto||0)?'selected':''}>${l}</option>`).join('')}</select>
    <p class="small muted">Hands-free reads the question, waits for you to recall, then reads the answer. You still grade each card (keys 1–4 or tap). In Quick revision it moves to the next card by itself — good for listening on the go. The screen stays on while it runs.</p>
    <div class="row end" style="margin-top:12px"><button class="btn" id="t_test">Test voice</button><button class="btn primary" id="t_save">Save</button></div>`,m=>{
    $('#t_r',m).oninput=e=>{$('#t_rv',m).textContent=e.target.value+'×';S.settings.ttsRate=+e.target.value};
    $('#t_v',m).onchange=e=>{S.settings.ttsVoice=e.target.value};
    $('#t_test',m).onclick=()=>TTS.say('Article 21 protects life and personal liberty. Telangana was formed on 2 June 2014.');
    $('#t_save',m).onclick=async()=>{Object.assign(S.settings,{tts:$('#t_on',m).checked,voiceCmd:$('#t_vc',m).checked,ttsVoice:$('#t_v',m).value,ttsRate:+$('#t_r',m).value,ttsAuto:+$('#t_a',m).value});
      await saveSettings();TTS.stop();TTS.wake(S.settings.tts||S.settings.voiceCmd);closeModal();after&&after()}});
}
// Speak the current card; in hands-free mode reveal after the think time. onAnswerDone runs after the answer is read.
// cmds: {show,repeat,again,hard,good,easy,got,miss} handlers to listen for once speaking is done.
function ttsCard(c,reveal,onReveal,onAnswerDone,cmds){
  const st=S.settings,talk=st.tts&&TTS.ok(),hear=st.voiceCmd&&VC.ok()&&cmds;
  VC.stop();clearTimeout(TTS.t);if(!talk&&!hear)return;TTS.wake(true);
  if(cmds&&!talk)delete cmds.repeat;
  const after=()=>{const a=+st.ttsAuto||0;
    if(!reveal&&a&&onReveal&&talk)TTS.t=setTimeout(onReveal,a*1000);
    if(hear)VC.listen(cmds,reveal?onAnswerDone:null);
    else if(reveal&&onAnswerDone&&talk)TTS.t=setTimeout(onAnswerDone,1500)};
  if(talk)TTS.say(cardSpeech(c,reveal),after);else after()}

/* ================= Voice commands (speech recognition) ================= */
const VC={tok:0,rec:null,
  Ctor:()=>window.SpeechRecognition||window.webkitSpeechRecognition,
  ok(){return!!this.Ctor()},
  LABEL:{show:'Show',repeat:'Repeat',again:'Again',hard:'Hard',good:'Good',easy:'Easy',got:'Got it',miss:'Missed'},
  // Checked in this order; EXACT words only count as the whole utterance (easily misheard inside sentences).
  WORDS:{repeat:['repeat','say again','read again','once more'],
    show:['show','show answer','answer','reveal','flip','open'],
    again:['again','wrong','forgot','forget','no','fail','one','1'],
    hard:['hard','difficult','tough','two','2'],
    good:['good','ok','okay','correct','right','yes','three','3'],
    easy:['easy','perfect','very easy','four','4'],
    miss:['missed','miss','again','wrong','no','forgot'],
    got:['got it','got','yes','good','correct','right','easy','ok','okay']},
  EXACT:{again:['won'],hard:['to','too'],good:['tree','free'],easy:['for','fore']},
  match(t,cmds){t=t.toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();
    for(const k of Object.keys(this.WORDS)){if(!cmds[k])continue;
      if((this.EXACT[k]||[]).includes(t))return k;
      if(this.WORDS[k].some(w=>(' '+t+' ').includes(' '+w+' ')))return k}
    return null},
  ui(t){const el=$('#vc');if(el)el.textContent=t},
  stop(){this.tok++;clearTimeout(this.t);if(this.rec){const r=this.rec;this.rec=null;try{r.abort()}catch(e){}}this.ui('')},
  // Listen until a command is heard or ms passes; the browser stops after each silence, so restart until then.
  listen(cmds,onTimeout,ms=15000){this.stop();const tok=this.tok,end=Date.now()+ms,C=this.Ctor();
    const hint='🎤 Say '+Object.keys(cmds).map(k=>this.LABEL[k]).join(' · ');
    const start=()=>{if(tok!==this.tok)return;
      if(Date.now()>end){this.rec=null;this.ui('🎤 Not heard — tap to continue');onTimeout&&onTimeout();return}
      const r=new C();this.rec=r;r.lang='en-IN';r.interimResults=true;r.maxAlternatives=5;r.continuous=false;let done=false;
      r.onresult=e=>{if(tok!==this.tok||done)return;const alts=[];for(const res of e.results)for(const a of res)alts.push(a.transcript);
        for(const a of alts){const k=this.match(a,cmds);if(k){done=true;this.stop();this.ui('🎤 '+this.LABEL[k]);navigator.vibrate?.(20);cmds[k]();return}}
        if(alts[0])this.ui(hint+' — heard “'+alts[0].trim()+'”')};
      r.onerror=e=>{if(tok!==this.tok)return;
        if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){this.tok++;this.rec=null;this.ui(e.error==='audio-capture'?'🎤 No microphone found':'🎤 Microphone blocked — allow it for this site')}
        else if(e.error==='network'){this.tok++;this.rec=null;this.ui('🎤 Voice needs internet — tap to rate')}};
      r.onend=()=>{if(tok!==this.tok||done)return;this.t=setTimeout(start,150)};
      try{r.start();this.ui(hint)}catch(e){this.t=setTimeout(start,400)}};
    start()}
};
