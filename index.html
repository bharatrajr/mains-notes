const SY={paper:'P2',q:'',ctx:true,open:{}};
try{Object.assign(SY,JSON.parse(localStorage.getItem('mains-syl')||'{}'))}catch(e){}
const saveSY=()=>{try{localStorage.setItem('mains-syl',JSON.stringify(SY))}catch(e){}};
const sylText=(p,s,u,pt)=>SY.ctx?`${paperName(p)} › ${s} › ${u}: ${pt}`:pt;
function vSyl(v){
  const ids=Object.keys(SYL);if(!SYL[SY.paper])SY.paper='P2';
  v.innerHTML=`<div class="chips" id="sypap">${ids.map(id=>`<button class="chip${id===SY.paper&&!SY.q?' on':''}" data-p="${id}">${id}</button>`).join('')}</div>
  <input type="search" id="syq" placeholder="Search all papers (e.g. Kakatiya, GST, 371D)" value="${esc(SY.q)}">
  <div class="switch small"><span>Copy with paper &amp; section (better for AI prompts)</span><input type="checkbox" id="syctx" ${SY.ctx?'checked':''}></div>
  <div id="sylist"></div>
  <p class="small muted" style="text-align:center;margin-top:16px">Based on the TSPSC Group-I Mains syllabus. Check the latest official notification for exact wording.</p>`;
  const draw=()=>{const q=SY.q.trim().toLowerCase();let h='';const pts=[];
    for(const p of q?ids:[SY.paper]){const secs=SYL[p];let ph='';
      secs.forEach(([s,units],si)=>{let sh='';
        units.forEach(([u,list],ui)=>{const hit=q?list.filter(pt=>(pt+' '+u+' '+s).toLowerCase().includes(q)):list;if(!hit.length)return;
          const key=p+'.'+si+'.'+ui,open=q||SY.open[key];
          sh+=`<div class="syu${open?' on':''}"><div class="syh" data-k="${key}"><span class="t">${esc(u)}</span><span class="small muted">${hit.length}</span><button class="btn ghost sycp" data-all="${pts.length}" data-n="${hit.length}" aria-label="Copy unit">Copy all</button></div>
          <div class="sypts">${hit.map(pt=>{pts.push([p,s,u,pt]);const i=pts.length-1;return`<div class="sypt"><span>${esc(pt)}</span><button class="iconbtn" data-c="${i}" aria-label="Copy point"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button class="iconbtn" data-u="${i}" aria-label="Use in Add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`}).join('')}</div></div>`});
        if(sh)ph+=`<div class="sec"><div class="h">${esc(s)}</div><div class="card" style="padding:4px 12px">${sh}</div></div>`});
      if(ph)h+=(q?`<h3>${esc(paperName(p))}</h3>`:`<h3 style="margin-top:4px">${esc(paperName(p))}</h3>`)+ph}
    $('#sylist').innerHTML=h||'<div class="empty">No syllabus point matches.</div>';
    $$('#sylist .syh').forEach(el=>el.onclick=e=>{if(e.target.closest('button')||SY.q)return;const k=el.dataset.k;SY.open[k]=!SY.open[k];saveSY();el.parentNode.classList.toggle('on',!!SY.open[k])});
    $$('#sylist [data-c]').forEach(b=>b.onclick=async()=>{const[p,s,u,pt]=pts[+b.dataset.c];toast(await copyText(sylText(p,s,u,pt))?'Copied':'Could not copy')});
    $$('#sylist .sycp').forEach(b=>b.onclick=async()=>{const a=+b.dataset.all,sl=pts.slice(a,a+ +b.dataset.n);const[p,s,u]=sl[0];
      const t=SY.ctx?`${paperName(p)} › ${s} › ${u}\n`+sl.map(x=>'- '+x[3]).join('\n'):sl.map(x=>'- '+x[3]).join('\n');toast(await copyText(t)?`Copied ${sl.length} points`:'Could not copy')});
    $$('#sylist [data-u]').forEach(b=>b.onclick=()=>{const[p,s,u,pt]=pts[+b.dataset.u];const line='Syllabus topic: '+sylText(p,s,u,pt);
      A.mode='notes';A.paper=p==='GE'?'GE':p;A.raw=A.raw.trim()?A.raw.trim()+'\n\n'+line:line;saveA();toast('Added to Add content');go('#/add')});
  };
  $$('#sypap .chip').forEach(b=>b.onclick=()=>{SY.paper=b.dataset.p;SY.q='';saveSY();vSyl(v)});
  $('#syq').oninput=e=>{SY.q=e.target.value;saveSY();$$('#sypap .chip').forEach(c=>c.classList.toggle('on',!SY.q&&c.dataset.p===SY.paper));draw()};
  $('#syctx').onchange=e=>{SY.ctx=e.target.checked;saveSY()};
  draw();
}

/* ================= Ideas: quick personal notes ================= */
const ID={q:'',paper:''};
function vIdeas(v){
  const q=ID.q.trim().toLowerCase();
  const list=S.ideas.filter(x=>(!ID.paper||x.paper===ID.paper)&&(!q||(x.text+' '+(x.tags||[]).join(' ')).toLowerCase().includes(q))).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.updated-a.updated);
  v.innerHTML=`<div class="card">
    <textarea id="inew" rows="4" placeholder="An idea, a quote, a data point, an answer angle, a link…"></textarea>
    <div class="row" style="margin-top:8px"><select id="ipaper" style="flex:1;min-width:140px">${paperOpts(ID.paper,'No paper')}</select><input type="text" id="itags" placeholder="Tags, comma separated" style="flex:1;min-width:140px"></div>
    <div class="row end" style="margin-top:8px"><button class="btn" id="ipaste">Paste</button><button class="btn primary" id="iadd">Save idea</button></div></div>
  <div class="row" style="margin-bottom:10px;flex-wrap:nowrap"><input type="search" id="iq" placeholder="Search ideas" value="${esc(ID.q)}" style="flex:1;min-width:0"><select id="ifp" style="width:auto;flex:none"><option value="">All</option>${PAPERS.map(p=>`<option value="${p.id}" ${p.id===ID.paper?'selected':''}>${p.id}</option>`).join('')}</select></div>
  <div id="ilist">${list.length?list.map(x=>`<div class="card idea" data-id="${x.id}">
    <div class="itext">${md(x.text)}</div>
    <div class="small muted" style="margin-top:6px">${x.pinned?'📌 ':''}${x.paper?`<span class="tag">${x.paper}</span>`:''}${(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}${fmtDate(x.updated)}</div>
    <div class="row" style="margin-top:6px;gap:2px"><button class="btn ghost" data-a="copy">Copy</button><button class="btn ghost" data-a="use">Use in Add</button><button class="btn ghost" data-a="pin">${x.pinned?'Unpin':'Pin'}</button><button class="btn ghost" data-a="edit">Edit</button><span class="spacer"></span><button class="btn ghost danger" data-a="del">Delete</button></div></div>`).join('')
    :`<div class="empty">${S.ideas.length?'No idea matches.':'No ideas yet. Jot down anything worth using in an answer or essay.'}</div>`}</div>`;
  const tags=s=>s.split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean);
  $('#ipaste').onclick=()=>pasteInto($('#inew'));
  $('#iadd').onclick=async()=>{const t=$('#inew').value.trim();if(!t)return toast('Write something first');
    await upsert('ideas',{id:uid(),created:Date.now(),text:t,paper:$('#ipaper').value,tags:tags($('#itags').value),pinned:false});toast('Idea saved');vIdeas(v)};
  $('#iq').oninput=e=>{ID.q=e.target.value;const p=e.target.selectionStart;vIdeas(v);const i=$('#iq');i.focus();i.setSelectionRange(p,p)};
  $('#ifp').onchange=e=>{ID.paper=e.target.value;vIdeas(v)};
  $$('#ilist .idea').forEach(el=>{const x=byId('ideas',el.dataset.id);
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
      if(a==='copy')toast(await copyText(x.text)?'Copied':'Could not copy');
      else if(a==='use'){A.mode='notes';if(x.paper)A.paper=x.paper;A.raw=A.raw.trim()?A.raw.trim()+'\n\n'+x.text:x.text;saveA();toast('Added to Add content');go('#/add')}
      else if(a==='pin'){x.pinned=!x.pinned;await upsert('ideas',x);vIdeas(v)}
      else if(a==='del'){if(!confirm('Delete this idea?'))return;await removeMany('ideas',[x.id]);toast('Deleted');vIdeas(v)}
      else if(a==='edit')modal(`<h3>Edit idea</h3><textarea id="et" rows="8">${esc(x.text)}</textarea><label>Paper</label><select id="ep">${paperOpts(x.paper,'No paper')}</select><label>Tags</label><input type="text" id="eg" value="${esc((x.tags||[]).join(', '))}">
        <div class="row end" style="margin-top:12px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="es">Save</button></div>`,m=>{
        $('#es',m).onclick=async()=>{const t=$('#et',m).value.trim();if(!t)return toast('Idea is empty');Object.assign(x,{text:t,paper:$('#ep',m).value,tags:tags($('#eg',m).value)});await upsert('ideas',x);closeModal();vIdeas(v)}})})});
}

/* ================= Boot ================= */
(async function boot(){
  try{await DB.open();const[notes,qas,cards,logs,attempts,ideas,settings,game]=await Promise.all([DB.all('notes'),DB.all('qas'),DB.all('cards'),DB.all('logs'),DB.all('attempts'),DB.all('ideas'),DB.getMeta('settings'),DB.getMeta('game')]);
    Object.assign(S,{notes,qas,cards,logs,attempts,ideas,settings:{...DEF,...(settings||{})}});if(game)G={...G,...game,seen:game.seen||{},days:game.days||{}}}
  catch(e){$('#view').innerHTML=`<div class="empty">Storage is unavailable in this browser (${esc(e.message||e)}). Open the app in Chrome, not in private mode.</div>`;return}
  applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
  render();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateBadge()});
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
let installEvt=null;const ib=document.getElementById('installbtn');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;ib.classList.remove('hide')});
ib.addEventListener('click',async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;ib.classList.add('hide')});
addEventListener('appinstalled',()=>ib.classList.add('hide'));
</script>
